name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }}, sans MT5)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # V14 tourne sur py3.12/Windows. La matrice heritee annoncait 3.10 a
        # 3.13 : quatre versions que personne n'execute jamais en local, donc
        # quatre facons d'etre rouge sans que ce soit une regression V14.
        # On ne teste que ce qu'on pretend supporter.
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run test suite
        # Le vrai objet de ce job : prouver que la suite passe HORS Windows et
        # SANS terminal MT5. L'extra `mt5` est conditionne a sys_platform win32
        # et n'est donc pas installe ici ; tous les imports MetaTrader5 du depot
        # sont paresseux (dans des fonctions), verifie.
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest-linux.log
      - name: Resume lisible en cas d echec
        # Sans authentification, les journaux Actions renvoient 403 meme sur un
        # depot public : un echec devenait indechiffrable depuis l'exterieur.
        # Le resume de job et l'artefact sont consultables au navigateur.
        if: failure()
        run: |
          {
            echo "### Suite en echec sous Linux"
            echo '```'
            tail -n 40 pytest-linux.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Journal complet en artefact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-linux-log
          path: pytest-linux.log
          retention-days: 14

  smoke-install:
    name: clean-install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fresh install (no dev extras) and import
        run: |
          python -m pip install --upgrade pip
          pip install .
          # Catches undeclared runtime deps (e.g. #994 python-dotenv): a bare
          # install must import the package and the CLI module.
          python -c "import tradingagents, cli.main; print('clean-install import OK')"

  lint:
    name: ruff (strict, full repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.15"
      - name: Lint gate (same command as the pre-commit hook)
        # One gate, two callers. The previous version ran `ruff check .` with
        # the strict pyproject select while the hook ran a narrow one: CI was
        # red on every push and stopped carrying any signal. Raising the bar is
        # done inside tools/lint_gate.sh, so both callers move together.
        run: sh tools/lint_gate.sh
