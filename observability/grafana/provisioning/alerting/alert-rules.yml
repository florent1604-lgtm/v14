apiVersion: 1

groups:
  - orgId: 1
    name: V14 Runtime
    folder: V14 Alerts
    interval: 20s
    rules:
      - uid: v14-high-error-rate
        title: High Error Rate
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model:
              datasource: {type: prometheus, uid: prometheus}
              editorMode: code
              expr: sum(rate(bot_errors_total[5m])) / clamp_min(sum(rate(bot_requests_total[5m])), 0.000001)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              type: reduce
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [0.02], type: gt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {params: [], type: last}
              expression: B
              type: threshold
              refId: C
        noDataState: NoData
        execErrState: Alerting
        for: 2m
        annotations:
          summary: Plus de 2 % d'erreurs V14 pendant 2 minutes
        labels: {severity: critical, service: bot-v14}

      - uid: v14-high-latency
        title: High Latency
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model:
              datasource: {type: prometheus, uid: prometheus}
              editorMode: code
              expr: histogram_quantile(0.95, sum by (le) (rate(bot_request_duration_seconds_bucket[5m])))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model: {expression: A, reducer: last, type: reduce, refId: B}
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [0.5], type: gt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {params: [], type: last}
              expression: B
              type: threshold
              refId: C
        noDataState: NoData
        execErrState: Alerting
        for: 2m
        annotations:
          summary: Latence HTTP p95 supérieure à 500 ms pendant 2 minutes
        labels: {severity: warning, service: bot-v14}

      - uid: v14-bot-down
        title: Bot Down
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 60, to: 0}
            model:
              datasource: {type: prometheus, uid: prometheus}
              editorMode: code
              expr: up{job="bot-v14"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model: {expression: A, reducer: last, type: reduce, refId: B}
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [1], type: lt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {params: [], type: last}
              expression: B
              type: threshold
              refId: C
        noDataState: Alerting
        execErrState: Alerting
        for: 1m
        annotations:
          summary: Prometheus ne collecte plus le bot V14 depuis une minute
        labels: {severity: critical, service: bot-v14}

      - uid: v14-high-memory
        title: High Memory
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model:
              datasource: {type: prometheus, uid: prometheus}
              editorMode: code
              expr: process_resident_memory_bytes{job="bot-v14"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model: {expression: A, reducer: last, type: reduce, refId: B}
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [524288000], type: gt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {params: [], type: last}
              expression: B
              type: threshold
              refId: C
        noDataState: NoData
        execErrState: Alerting
        for: 2m
        annotations:
          summary: Le groupe moteur V14 dépasse 500 Mio de RAM
        labels: {severity: warning, service: bot-v14}

      - uid: v14-no-http-traffic
        title: No HTTP Traffic
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 60, to: 0}
            model:
              datasource: {type: prometheus, uid: prometheus}
              editorMode: code
              expr: sum(rate(bot_requests_total[1m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model: {expression: A, reducer: last, type: reduce, refId: B}
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [0.000001], type: lt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {params: [], type: last}
              expression: B
              type: threshold
              refId: C
        noDataState: Alerting
        execErrState: Alerting
        for: 1m
        annotations:
          summary: Aucun trafic HTTP V14 depuis une minute
          description: Cette alerte est informative si personne ne consulte le dashboard.
        labels: {severity: warning, service: bot-v14}
